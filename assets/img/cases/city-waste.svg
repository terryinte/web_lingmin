<radialGradient id="gl" cx=".5" cy="1.15" r=".75"><stop offset="0" stop-color="#2fbfa8" stop-opacity=".22"/><stop offset="1" stop-color="#2fbfa8" stop-opacity="0"/></radialGradient>
